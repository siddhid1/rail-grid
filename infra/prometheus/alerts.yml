groups:
  - name: irctc
    rules:
      - alert: HighHttpErrorRate
        expr: sum(rate(http_requests_total{status_code=~"5.."}[5m])) / sum(rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: HTTP error rate is above 5 percent
      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 2
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: p95 HTTP latency is above 2 seconds
      - alert: CircuitBreakerOpen
        expr: gateway_circuit_breaker_state > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: Gateway circuit breaker is open
