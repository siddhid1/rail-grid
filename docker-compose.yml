services:
  postgres:
    image: postgres:15-alpine
    container_name: irctc-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks: [irctc-network]

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    networks: [irctc-network]

  redis:
    image: redis/redis-stack:6.2.6-v17
    command: redis-server --requirepass irctcpass --loadmodule /opt/redis-stack/lib/redisearch.so --loadmodule /opt/redis-stack/lib/rejson.so
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-data:/data
    networks: [irctc-network]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks: [irctc-network]

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [irctc-network]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    depends_on: [kafka]
    ports:
      - "8082:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
    networks: [irctc-network]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: irctc
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    networks: [irctc-network]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks: [irctc-network]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    depends_on: [elasticsearch]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks: [irctc-network]

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [irctc-network]

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [irctc-network]

  api-gateway:
    build:
      context: .
      dockerfile: packages/api-gateway/Dockerfile
    env_file: .env
    ports:
      - "4000:4000"
    depends_on: [redis]
    networks: [irctc-network]

  user-service:
    build:
      context: .
      dockerfile: packages/user-service/Dockerfile
    env_file: .env
    ports:
      - "4001:4001"
    depends_on: [postgres, redis, kafka]
    networks: [irctc-network]

  search-service:
    build:
      context: .
      dockerfile: packages/search-service/Dockerfile
    env_file: .env
    ports:
      - "4002:4002"
    depends_on: [elasticsearch, kafka]
    networks: [irctc-network]

  admin-service:
    build:
      context: .
      dockerfile: packages/admin-service/Dockerfile
    env_file: .env
    ports:
      - "4003:4003"
    depends_on: [postgres, kafka]
    networks: [irctc-network]

  notification-service:
    build:
      context: .
      dockerfile: packages/notification-service/Dockerfile
    env_file: .env
    ports:
      - "4004:4004"
    depends_on: [kafka]
    networks: [irctc-network]

  booking-service:
    build:
      context: .
      dockerfile: packages/booking-service/Dockerfile
    env_file: .env
    ports:
      - "4005:4005"
    depends_on: [postgres, redis, kafka]
    networks: [irctc-network]

  payment-service:
    build:
      context: .
      dockerfile: packages/payment-service/Dockerfile
    env_file: .env
    ports:
      - "4006:4006"
    depends_on: [postgres, kafka]
    networks: [irctc-network]

  inventory-service:
    build:
      context: .
      dockerfile: packages/inventory-service/Dockerfile
    env_file: .env
    ports:
      - "4007:4007"
    depends_on: [postgres, redis, kafka]
    networks: [irctc-network]

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  elasticsearch-data:
  grafana-data:

networks:
  irctc-network:
    driver: bridge
